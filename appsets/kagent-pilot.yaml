apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kagent-pilot
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: ghcr.io/kagent-dev/kagent/helm
      chart: kagent-crds
      targetRevision: 0.10.7
      helm:
        releaseName: kagent-crds
        valuesObject:
          kmcp:
            enabled: false
    - repoURL: ghcr.io/kagent-dev/kagent/helm
      chart: kagent
      targetRevision: 0.10.7
      helm:
        releaseName: kagent
        valuesObject:
          rbac:
            namespaces: [kagent]
          kmcp:
            enabled: false
          kagent-tools:
            enabled: false
          grafana-mcp:
            enabled: false
          k8s-agent:
            enabled: false
          kgateway-agent:
            enabled: false
          istio-agent:
            enabled: false
          promql-agent:
            enabled: false
          observability-agent:
            enabled: false
          argo-rollouts-agent:
            enabled: false
          helm-agent:
            enabled: false
          cilium-policy-agent:
            enabled: false
          cilium-manager-agent:
            enabled: false
          cilium-debug-agent:
            enabled: false
          database:
            postgres:
              bundled:
                storageClassName: longhorn
          providers:
            default: openAI
            openAI:
              provider: OpenAI
              model: upstage/solar-mini4:free
              apiKeySecretRef: kagent-model-proxy
              apiKeySecretKey: OPENAI_API_KEY
              apiKey: pilot-only-proxy-ignores-this-bearer
              config:
                baseUrl: http://hermes-model-proxy.hermes.svc.cluster.local:8645/v1
    - repoURL: https://github.com/ElPoshoX/homelab-apps.git
      targetRevision: HEAD
      path: apps/kagent/pilot
  destination:
    name: in-cluster
    namespace: kagent
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    automated:
      prune: true
      selfHeal: true
