apiVersion: v1
kind: ConfigMap
metadata:
  name: headroom-dashboard-gateway
data:
  Caddyfile: |
    :8080 {
      @operator path /dashboard* /stats* /settings* /quota /subscription-window /metrics
      handle @operator {
        reverse_proxy {$POD_IP}:8787 {
          header_up Host 127.0.0.1:8787
          header_up -Authorization
          header_up X-Headroom-Proxy-Token {$HEADROOM_PROXY_TOKEN}
        }
      }
      handle {
        reverse_proxy {$POD_IP}:8787
      }
    }
