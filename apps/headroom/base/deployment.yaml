apiVersion: apps/v1
kind: Deployment
metadata:
  name: headroom
  labels:
    app: headroom
    app.kubernetes.io/name: headroom
    app.kubernetes.io/instance: headroom
    app.kubernetes.io/component: proxy
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: headroom
  template:
    metadata:
      labels:
        app: headroom
        app.kubernetes.io/name: headroom
        app.kubernetes.io/component: proxy
    spec:
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
      containers:
        - name: headroom
          image: ghcr.io/headroomlabs-ai/headroom:0.45.0-code-nonroot
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: HEADROOM_HOST
              value: "0.0.0.0"
            - name: HEADROOM_PROXY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: headroom-proxy-token
                  key: HEADROOM_PROXY_TOKEN
            - name: HOME
              value: /home/nonroot
            - name: HEADROOM_WORKSPACE_DIR
              value: /home/nonroot/.headroom
            - name: HEADROOM_CONFIG_DIR
              value: /home/nonroot/.headroom/config
            - name: TZ
              value: "America/Mexico_City"
          ports:
            - containerPort: 8787
              name: http
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            failureThreshold: 20
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /home/nonroot/.headroom
        - name: dashboard-gateway
          image: caddy:2.10.2-alpine
          command: [sh, -c]
          args:
            - cp /usr/bin/caddy /tmp/caddy && exec /tmp/caddy run --config /etc/caddy/Caddyfile
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: XDG_CONFIG_HOME
              value: /tmp/caddy-config
            - name: XDG_DATA_HOME
              value: /tmp/caddy-data
            - name: HEADROOM_PROXY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: headroom-proxy-token
                  key: HEADROOM_PROXY_TOKEN
          ports:
            - containerPort: 8080
              name: auth-http
          volumeMounts:
            - name: dashboard-gateway
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
              readOnly: true
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: headroom-data
        - name: dashboard-gateway
          configMap:
            name: headroom-dashboard-gateway
