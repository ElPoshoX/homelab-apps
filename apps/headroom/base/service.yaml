apiVersion: v1
kind: Service
metadata:
  name: headroom
  labels:
    app: headroom
    app.kubernetes.io/name: headroom
spec:
  selector:
    app: headroom
  ports:
    - name: http
      port: 80
      targetPort: auth-http
      protocol: TCP
    - name: agent-http
      port: 8081
      targetPort: agent-http
      protocol: TCP
