apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault-webdav
  labels:
    app.kubernetes.io/name: vault-webdav
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vault-webdav
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vault-webdav
    spec:
      automountServiceAccountToken: false
      containers:
      - name: dufs
        image: sigoden/dufs:v0.46.0
        args:
        - /data
        - --allow-all
        - --auth
        - $(DUFS_AUTH)
        - --port
        - "5000"
        env:
        - name: DUFS_AUTH
          valueFrom:
            secretKeyRef:
              name: vault-webdav-auth
              key: auth
        ports:
        - containerPort: 5000
          name: http
          protocol: TCP
        resources:
          requests:
            memory: "32Mi"
            cpu: "10m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 5
          periodSeconds: 30
        readinessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 3
          periodSeconds: 10
        volumeMounts:
        - name: vault-data
          mountPath: /data
      volumes:
      - name: vault-data
        nfs:
          server: truenas.elposhox.dev
          path: /mnt/HomeLab/Obsidian-Vault
