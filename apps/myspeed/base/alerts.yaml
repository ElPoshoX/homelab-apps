apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: speedtest-exporter-alerts
spec:
  groups:
    - name: speedtest-exporter-tests
      rules:
        - alert: SpeedtestExporterTestFailed
          expr: sum(increase(speedtest_tests_total{namespace="myspeed",outcome="error"}[30m])) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "Internet speed test failed"
            description: "The Go speedtest exporter reported a failed test. Check its logs and outbound connectivity."

        - alert: SpeedtestExporterScheduleStalled
          expr: speedtest_last_test_timestamp_seconds{namespace="myspeed"} > 0 and (time() - speedtest_last_test_timestamp_seconds{namespace="myspeed"}) > 21600
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "No successful speed test in over six hours"
            description: "The scheduled speed tests have not produced a result for over six hours. Check the exporter and outbound connectivity."

        - alert: SpeedtestExporterZeroDownload
          expr: speedtest_download_mbps{namespace="myspeed"} == 0 and speedtest_last_test_timestamp_seconds{namespace="myspeed"} > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Speed test reported zero download throughput"
            description: "The Go speedtest exporter completed a test with zero download throughput. Check the selected test server and outbound connectivity."
