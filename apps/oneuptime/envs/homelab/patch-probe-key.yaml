# The upstream chart only accepts a literal probe key or its generated Secret.
# Reference the SOPS-managed key so a chart render cannot rotate the probe ID.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oneuptime-probe-one
  namespace: oneuptime
spec:
  template:
    spec:
      containers:
        - name: oneuptime-probe-one
          env:
            - name: PROBE_KEY
              valueFrom:
                secretKeyRef:
                  name: oneuptime-runtime-secret
                  key: PROBE_KEY
