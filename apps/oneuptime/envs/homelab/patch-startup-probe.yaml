# The chart leaves startupProbe.timeoutSeconds at one second. These live checks
# query external services and can exceed that limit even when healthy.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oneuptime-app
  namespace: oneuptime
spec:
  template:
    spec:
      containers:
        - name: oneuptime-app
          startupProbe:
            timeoutSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oneuptime-worker
  namespace: oneuptime
spec:
  template:
    spec:
      containers:
        - name: oneuptime-worker
          startupProbe:
            timeoutSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oneuptime-nginx
  namespace: oneuptime
spec:
  template:
    spec:
      containers:
        - name: oneuptime-nginx
          startupProbe:
            timeoutSeconds: 10
