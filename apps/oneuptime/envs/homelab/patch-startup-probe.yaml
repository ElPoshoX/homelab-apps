# The chart omits startupProbe.timeoutSeconds. The live endpoint checks three
# external databases and takes about four seconds while they are healthy.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oneuptime-app
  namespace: oneuptime
spec:
  template:
    spec:
      containers:
        - name: oneuptime-app
          startupProbe:
            timeoutSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oneuptime-worker
  namespace: oneuptime
spec:
  template:
    spec:
      containers:
        - name: oneuptime-worker
          startupProbe:
            timeoutSeconds: 10
