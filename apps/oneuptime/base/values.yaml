# OneUptime Helm Chart Configuration
# Using external databases on TrueNAS

global:
  storageClass: longhorn
  clusterDomain: cluster.local

# Deployment Configuration
host: uptime.elposhox.dev
httpProtocol: https

# Image registry
image:
  registry: docker.io
  pullPolicy: IfNotPresent
  tag: "10.5.29"

# Keep runtime identities stable across Kustomize Helm renders and pod restarts.
externalSecrets:
  oneuptimeSecret:
    existingSecret:
      name: oneuptime-runtime-secret
      passwordKey: ONEUPTIME_SECRET
  registerProbeKey:
    existingSecret:
      name: oneuptime-runtime-secret
      passwordKey: REGISTER_PROBE_KEY
  encryptionSecret:
    existingSecret:
      name: oneuptime-runtime-secret
      passwordKey: ENCRYPTION_SECRET

# Deployment replicas
deployment:
  replicaCount: 1

# No KEDA ScaledObjects or ScaledJobs are used in this homelab.
keda:
  enabled: false

# Disable internal databases - use external on TrueNAS
postgresql:
  enabled: false

redis:
  enabled: false

clickhouse:
  enabled: false

# External PostgreSQL Configuration
externalPostgres:
  host: oneuptime-postgres.elposhox.dev
  port: 30200
  username: poshox
  database: oneuptime
  existingSecret:
    name: oneuptime-secret
    passwordKey: POSTGRES_PASSWORD

# External Redis Configuration
externalRedis:
  host: oneuptime-redis.elposhox.dev
  port: 30201
  existingSecret:
    name: oneuptime-secret
    passwordKey: REDIS_PASSWORD

# External ClickHouse Configuration
externalClickhouse:
  host: oneuptime-clickhouse.elposhox.dev
  port: 443
  username: poshox
  isHostHttps: true
  existingSecret:
    name: oneuptime-secret
    passwordKey: CLICKHOUSE_PASSWORD

# Enable nginx frontend server
nginx:
  enabled: true
  service:
    type: ClusterIP

# Core Services
home:
  enabled: false

app:
  enabled: true
  replicaCount: 1

worker:
  enabled: true
  replicaCount: 1
  # Preserve the existing worker port during the chart migration.
  ports:
    http: 1445

# Optional services - disable for minimal homelab setup
testServer:
  enabled: false

aiAgent:
  enabled: false

affinity: {}
tolerations: []
