# Grafana Helm Chart Configuration
# Production-ready observability frontend for homelab stack

# Global configuration
replicas: 2
image:
  repository: grafana/grafana
  tag: 13.3.2
  pullPolicy: IfNotPresent

# Preserve the projected memory limit used by the current deployment.
envValueFrom:
  GOMEMLIMIT:
    resourceFieldRef:
      resource: limits.memory
      divisor: "1"

# Admin user configuration
admin:
  existingSecret: grafana-admin-secret
  passwordKey: password

# Persistence configuration (20Gi Longhorn PVC)
persistence:
  enabled: true
  type: pvc
  storageClassName: longhorn
  size: 20Gi
  accessModes:
    - ReadWriteMany

# Service configuration
service:
  type: ClusterIP
  port: 3000

# Ingress configuration (disabled - using HTTPRoute instead)
ingress:
  enabled: false

# Gateway API HTTPRoute configuration
route:
  main:
    enabled: true
    hostnames:
      - grafana.elposhox.dev
    parentRefs:
      - group: gateway.networking.k8s.io
        kind: Gateway
        name: homelab-gateway
        namespace: ingress

# --- Sidecar ---
# ConfigMap-based dashboard discovery across all namespaces
sidecar:
  dashboards:
    enabled: true
    searchNamespace: ALL
    label: grafana_dashboard
    labelValue: "1"
    folderAnnotation: grafana_folder
    provider:
      foldersFromFilesStructure: true

# Datasources configuration
# Prometheus stays explicitly defined since this is the standalone grafana chart (not kube-prometheus-stack)
datasources:
  datasources.yaml:
    apiVersion: 1
    deleteDatasources:
      - name: Prometheus
        orgId: 1
      - name: Loki
        orgId: 1
      - name: alertmanager
        orgId: 1
      - name: Mimir
        orgId: 1
      - name: Tempo
        orgId: 1
    datasources:
      # Prometheus (Metrics)
      - name: Prometheus
        uid: prometheus
        type: prometheus
        url: http://monitoring-prometheus.monitoring.svc.cluster.local:9090
        isDefault: true
        access: proxy
        editable: true
        jsonData:
          timeInterval: 15s
      # Loki (Logs)
      - name: Loki
        uid: loki
        type: loki
        url: http://loki.loki.svc.cluster.local:3100
        access: proxy
        editable: true
      # Alertmanager
      - name: alertmanager
        uid: alertmanager
        type: alertmanager
        url: http://monitoring-alertmanager.monitoring.svc.cluster.local:9093
        access: proxy
        editable: true
        jsonData:
          implementation: prometheus
          handleGrafanaManagedAlerts: true
      # Mimir (OTLP Metrics) — Prometheus-compatible API
      - name: Mimir
        uid: mimir
        type: prometheus
        url: http://mimir-gateway.mimir.svc.cluster.local/prometheus
        access: proxy
        editable: true
        jsonData:
          timeInterval: 15s
          timeout: 300
      # Tempo (Traces) — httpMethod: GET and no gRPC; port 3200 speaks HTTP/1.1
      - name: Tempo
        uid: tempo
        type: tempo
        url: http://tempo.tempo.svc.cluster.local:3200
        access: proxy
        editable: true
        jsonData:
          httpMethod: GET
          streamingEnabled:
            search: false
          tracesToMetrics:
            datasourceUid: prometheus
          tracesToLogsV2:
            datasourceUid: loki
          serviceMap:
            datasourceUid: prometheus

# Resource requests and limits
resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Pod security context
securityContext:
  runAsNonRoot: true
  runAsUser: 472
  runAsGroup: 472
  fsGroup: 472

# Container security context
containerSecurityContext:
  allowPrivilegeEscalation: false
  privileged: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

# Environment variables
env:
  GF_SECURITY_ADMIN_USER: admin
  GF_USERS_ALLOW_SIGN_UP: "false"
  GF_AUTH_DISABLE_LOGIN_FORM: "false"
  GF_FEATURE_TOGGLES_ENABLE: "nestedFolders,publicDashboards"

# Liveness and readiness probes
livenessProbe:
  httpGet:
    path: /api/health
    port: 3000
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /api/health
    port: 3000
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 3

# Pod disruption budget for HA
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Network policy (optional)
networkPolicy:
  enabled: false

# RBAC
rbac:
  pspEnabled: false
