apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/part-of: grafana
      homelab.local/OwnedBy: ElPoshoX

namespace: grafana

helmCharts:
  - name: grafana
    repo: https://grafana-community.github.io/helm-charts
    releaseName: grafana
    version: "14.6.0"
    valuesFile: values.yaml
    namespace: grafana
    skipTests: true

resources:
  - namespace.yaml
  - secret.yaml
  - dashboard-speedtest-exporter-cm.yaml

configMapGenerator:
  - name: grafana-dashboards-kubernetes
    files:
      - dashboards/kubernetes/k8s-views-global.json
      - dashboards/kubernetes/k8s-views-namespaces.json
      - dashboards/kubernetes/k8s-views-nodes.json
      - dashboards/kubernetes/k8s-views-pods.json
      - dashboards/kubernetes/k8s-system-api-server.json
      - dashboards/kubernetes/k8s-system-coredns.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Kubernetes
        argocd.argoproj.io/sync-options: ServerSideApply=true
  - name: grafana-dashboard-node-exporter
    files:
      - dashboards/infrastructure/node-exporter.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Infrastructure
        argocd.argoproj.io/sync-options: ServerSideApply=true

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: grafana
    patch: |-
      - op: add
        path: /spec/revisionHistoryLimit
        value: 1
