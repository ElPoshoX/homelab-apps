apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-speedtest-tracker
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Infrastructure"
data:
  speedtest-tracker.json: |
    {
      "uid": "speedtest-tracker",
      "title": "Internet · Speedtest Tracker",
      "tags": [
        "network",
        "speedtest",
        "homelab"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "5m",
      "time": {
        "from": "now-7d",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Latest download · Mbps",
          "description": "Latest completed speed test; measured in megabits per second.",
          "datasource": {
            "type": "prometheus",
            "uid": "mimir"
          },
          "gridPos": {
            "h": 5,
            "w": 8,
            "x": 0,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 1
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "mimir"
              },
              "expr": "max(speedtest_tracker_download_bits{namespace=\"myspeed\"}) / 1e6",
              "legendFormat": "Download",
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": ""
            },
            "orientation": "auto",
            "textMode": "value",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto"
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Latest upload · Mbps",
          "description": "Latest completed speed test; measured in megabits per second.",
          "datasource": {
            "type": "prometheus",
            "uid": "mimir"
          },
          "gridPos": {
            "h": 5,
            "w": 8,
            "x": 8,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 1
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "mimir"
              },
              "expr": "max(speedtest_tracker_upload_bits{namespace=\"myspeed\"}) / 1e6",
              "legendFormat": "Upload",
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": ""
            },
            "orientation": "auto",
            "textMode": "value",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto"
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Latest ping · ms",
          "description": "Latest completed speed test ping.",
          "datasource": {
            "type": "prometheus",
            "uid": "mimir"
          },
          "gridPos": {
            "h": 5,
            "w": 8,
            "x": 16,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "decimals": 1
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "mimir"
              },
              "expr": "max(speedtest_tracker_ping_ms{namespace=\"myspeed\"})",
              "legendFormat": "Ping",
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ],
              "fields": ""
            },
            "orientation": "auto",
            "textMode": "value",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto"
          }
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Throughput · Mbps",
          "description": "History of completed speed tests from the local Mimir datasource.",
          "datasource": {
            "type": "prometheus",
            "uid": "mimir"
          },
          "gridPos": {
            "h": 9,
            "w": 24,
            "x": 0,
            "y": 5
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 1
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "mimir"
              },
              "expr": "max(speedtest_tracker_download_bits{namespace=\"myspeed\"}) / 1e6",
              "legendFormat": "Download",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "mimir"
              },
              "expr": "max(speedtest_tracker_upload_bits{namespace=\"myspeed\"}) / 1e6",
              "legendFormat": "Upload",
              "refId": "B"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Ping and jitter · ms",
          "description": "Jitter is shown when the speed test reports it.",
          "datasource": {
            "type": "prometheus",
            "uid": "mimir"
          },
          "gridPos": {
            "h": 9,
            "w": 24,
            "x": 0,
            "y": 14
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "decimals": 1
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "mimir"
              },
              "expr": "max(speedtest_tracker_ping_ms{namespace=\"myspeed\"})",
              "legendFormat": "Ping",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "mimir"
              },
              "expr": "max(speedtest_tracker_ping_jitter_ms{namespace=\"myspeed\"})",
              "legendFormat": "Ping jitter",
              "refId": "B"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Packet loss · %",
          "description": "Shown only when the speed test reports packet loss.",
          "datasource": {
            "type": "prometheus",
            "uid": "mimir"
          },
          "gridPos": {
            "h": 7,
            "w": 24,
            "x": 0,
            "y": 23
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 1
            },
            "overrides": []
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "mimir"
              },
              "expr": "max(speedtest_tracker_packet_loss_percent{namespace=\"myspeed\"})",
              "legendFormat": "Packet loss",
              "refId": "A"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          }
        }
      ]
    }
