apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: officina-cockpit
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: homelab-gateway
      namespace: ingress
  hostnames:
    - cockpit.elposhox.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ''
          kind: Service
          name: officina
          port: 8081
          weight: 1
