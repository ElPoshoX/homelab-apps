apiVersion: apps/v1
kind: Deployment
metadata:
  name: officina
  labels:
    app: officina
    app.kubernetes.io/name: officina
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: officina
  template:
    metadata:
      annotations:
        officina.homelab.local/restart-trigger: "cockpit-real-pod-cidr-fix"
      labels:
        app: officina
        app.kubernetes.io/name: officina
    spec:
      automountServiceAccountToken: true
      securityContext:
        fsGroup: 3000
      serviceAccountName: officina
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: officina
          image: ghcr.io/elposhox/officina:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: health
            - containerPort: 8081
              name: cockpit
          env:
            - name: OFFICINA_WORKDIR
              value: /data/state
            - name: OFFICINA_APPROVED_WORKSPACE_ROOTS
              value: /data/workspaces
            - name: OFFICINA_VALIDATOR_IMAGE
              value: ghcr.io/elposhox/officina-validator:latest
            # add-jetstream-bus: durable event bus against the cluster
            # NATS (JetStream already enabled on nats-0). memory bus is
            # rejected at boot while OFFICINA_ENV=production.
            - name: OFFICINA_ENV
              value: "production"
            - name: OFFICINA_EVENT_BUS
              value: "jetstream"
            - name: OFFICINA_NATS_URL
              value: "nats://nats.nats.svc:4222"
            - name: OFFICINA_OPERATOR_TENANTS
              value: "zero"
            - name: OFFICINA_METALOOP_INTERVAL_SECONDS
              value: "120"
          envFrom:
            - secretRef:
                name: officina-secrets
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: workspaces
              mountPath: /data/workspaces
            - name: state
              mountPath: /data/state
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 30
          securityContext:
            runAsUser: 3000
            runAsGroup: 3000
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tmp
          emptyDir: {}
        - name: workspaces
          persistentVolumeClaim:
            claimName: officina-workspaces
        - name: state
          persistentVolumeClaim:
            claimName: officina-state
