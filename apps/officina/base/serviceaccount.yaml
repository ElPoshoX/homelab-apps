apiVersion: v1
kind: ServiceAccount
metadata:
  name: officina
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: officina-validator-jobs
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "delete"]
  # The validator client locates the Job's pod and reads its logs to
  # return the gate's output (seen live: 403 listing pods after the first
  # successful Job).
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: officina-validator-jobs
subjects:
  - kind: ServiceAccount
    name: officina
roleRef:
  kind: Role
  name: officina-validator-jobs
  apiGroup: rbac.authorization.k8s.io
