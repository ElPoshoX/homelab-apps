apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: officina-egress
spec:
  endpointSelector:
    matchLabels:
      app: officina
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
          rules:
            dns:
              - matchPattern: "*"

    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: nats
            app.kubernetes.io/name: nats
      toPorts:
        - ports:
            - port: "4222"
              protocol: TCP

    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
            - port: "443"
              protocol: TCP

    - toCIDRSet:
        - cidr: 10.96.0.1/32
        - cidr: 192.168.5.2/32
        - cidr: 192.168.5.3/32
        - cidr: 192.168.5.4/32
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
            - port: "443"
              protocol: TCP

    - toServices:
        - k8sService:
            serviceName: kubernetes
            namespace: default
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP

    - toFQDNs:
        - matchName: github.com
        - matchName: api.github.com
        - matchName: api.telegram.org
        - matchName: api.moonshot.ai
        - matchName: api.kimi.com
        - matchName: discord.com
        - matchName: gateway.discord.gg
        - matchName: cdn.discordapp.com
        - matchName: api.linear.app
        - matchName: api.linear.app
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: officina-ingress
spec:
  endpointSelector:
    matchLabels:
      app: officina
  ingress:
    - fromEntities:
        - world
        - cluster
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
            - port: "8081"
              protocol: TCP
            - port: "8082"
              protocol: TCP
