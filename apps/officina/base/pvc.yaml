apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: officina-workspaces
  labels:
    recurring-job.longhorn.io/source: enabled
    recurring-job-group.longhorn.io/app-state: enabled
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-officina
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: officina-state
  labels:
    recurring-job.longhorn.io/source: enabled
    recurring-job-group.longhorn.io/app-state: enabled
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-officina
  resources:
    requests:
      storage: 50Gi
