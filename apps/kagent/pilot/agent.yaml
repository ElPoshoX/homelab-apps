apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: kepler-pilot
  namespace: kagent
spec:
  description: Read-only delegation test for Kepler. No Kubernetes tools or permissions.
  type: Declarative
  declarative:
    runtime: go
    modelConfig: default-model-config
    systemMessage: |
      You are a test specialist delegated by Kepler. Answer directly with facts.
      You have no cluster tools. Never claim to have inspected the cluster.
      If a request needs unavailable tools, state that limitation plainly.
    a2aConfig:
      skills:
        - id: delegation-smoke-test
          name: Delegation smoke test
          description: Answer a factual question to verify Kepler can invoke a kagent agent.
          tags: [test, delegation]
    deployment:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi
