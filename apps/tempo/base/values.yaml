global:
  commonLabels: {}
  imageRegistry: null

nameOverride: ""
fullnameOverride: ""

replicas: 1

labels:
  app.kubernetes.io/managed-by: kustomize
  app.kubernetes.io/part-of: tempo
  homelab.local/OwnedBy: ElPoshoX

annotations: {}

tempo:
  registry: docker.io
  repository: grafana/tempo
  tag: ""
  pullPolicy: IfNotPresent

  updateStrategy: RollingUpdate
  # Keep the existing resource limit until the Tempo 3 memory profile is observed.
  resources:
    requests:
      cpu: 300m
      memory: 1Gi
    limits:
      cpu: 500m
      memory: 16Gi

  multitenancyEnabled: false
  reportingEnabled: false

  metricsGenerator:
    enabled: true
    remoteWriteUrl: "http://mimir-gateway.mimir.svc.cluster.local/api/v1/push"
    processor:
      span_metrics:
        dimensions:
          - model
          - tool_name
          - success
          - span.type
        enable_target_info: true
    registry:
      external_labels:
        source: tempo
        cluster: homelab
    storage:
      path: "/var/tempo/metrics"
      remote_write: []
  querier:
    max_concurrent_queries: 20
  queryFrontend: {}

  retention: 336h

  overrides:
    defaults:
      metrics_generator:
        processors:
          - span-metrics
    per_tenant_override_config: /conf/overrides.yaml
  per_tenant_overrides: {}

  server:
    http_listen_port: 3200

  livenessProbe:
    httpGet:
      path: /ready
      port: 3200
    initialDelaySeconds: 30
    periodSeconds: 15
    timeoutSeconds: 10
    # /ready serves 503 for minutes while draining a backlog (prod 2026-09-17:
    # 30-day flush backlog -> liveness kill loop, exit 137, zero progress).
    # 40 * 15s = 10 min of grace before kubelet restarts it.
    failureThreshold: 40
    successThreshold: 1

  readinessProbe:
    httpGet:
      path: /ready
      port: 3200
    initialDelaySeconds: 20
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1

  storage:
    trace:
      backend: s3
      # Preserve the Tempo 2.10 block format during the major-version migration.
      block:
        version: vParquet4
      s3:
        bucket: tempo-bucket
        endpoint: garage.garage.svc.cluster.local:3900
        access_key: ${TEMPO_S3_ACCESS_KEY_ID}
        secret_key: ${TEMPO_S3_SECRET_ACCESS_KEY}
        insecure: true
      wal:
        path: /var/tempo/wal

  receivers:
    jaeger:
      protocols:
        grpc:
          endpoint: 0.0.0.0:14250
        thrift_binary:
          endpoint: 0.0.0.0:6832
        thrift_compact:
          endpoint: 0.0.0.0:6831
        thrift_http:
          endpoint: 0.0.0.0:14268
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"
    zipkin:
      endpoint: 0.0.0.0:9411

  securityContext: {}

  extraArgs:
    config.expand-env: "true"

  extraEnv: []

  extraEnvFrom:
    - secretRef:
        name: tempo-s3-credentials

  extraVolumeMounts: []

tempoQuery:
  repository: grafana/tempo-query
  tag: null
  pullPolicy: IfNotPresent
  enabled: false
  service:
    port: 16686
  ingress:
    enabled: false
    annotations: {}
    labels: {}
    path: /
    pathType: Prefix
    hosts:
      - query.tempo.example.com
    extraPaths: []
    tls: []
  resources: {}
  extraArgs: {}
  extraEnv: []
  extraVolumeMounts: []
  securityContext: {}

securityContext:
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  runAsNonRoot: true

serviceAccount:
  create: true
  name: null
  imagePullSecrets: []
  annotations: {}
  labels: {}
  automountServiceAccountToken: true

service:
  type: ClusterIP
  clusterIP: ""
  loadBalancerIP: null
  protocol: "TCP"
  annotations: {}
  labels: {}
  targetPort: ""

serviceMonitor:
  enabled: true
  interval: ""
  additionalLabels: {}
  annotations: {}

persistence:
  enabled: true
  enableStatefulSetAutoDeletePVC: false
  storageClassName: longhorn
  accessModes:
    - ReadWriteMany
  size: 30Gi

podAnnotations: {}
podLabels: {}
extraLabels: {}
extraVolumes: []

nodeSelector: {}
tolerations: []
affinity: {}

priorityClassName: null
hostAliases: []

networkPolicy:
  enabled: false
  ingress: true
  allowExternal: true
  explicitNamespacesSelector: {}
  egress:
    enabled: false
    blockDNSResolution: false
    ports: []
    to: []

podDisruptionBudget:
  enabled: true
  minAvailable: 1

rbac:
  create: true
