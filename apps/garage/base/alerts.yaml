apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: garage-alerts
  labels:
    app.kubernetes.io/name: garage
spec:
  groups:
    - name: garage-storage
      rules:
        - alert: GarageDiskUsageHigh
          expr: |
            (
              kubelet_volume_stats_used_bytes{namespace="garage", persistentvolumeclaim=~".*garage.*"}
              / kubelet_volume_stats_capacity_bytes{namespace="garage", persistentvolumeclaim=~".*garage.*"}
            ) > 0.75
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Garage disk usage above 75%"
            description: "PVC {{ $labels.persistentvolumeclaim }} is at {{ $value | humanizePercentage }}."

        - alert: GarageDiskUsageCritical
          expr: |
            (
              kubelet_volume_stats_used_bytes{namespace="garage", persistentvolumeclaim=~".*garage.*"}
              / kubelet_volume_stats_capacity_bytes{namespace="garage", persistentvolumeclaim=~".*garage.*"}
            ) > 0.85
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Garage disk usage above 85%"
            description: "PVC {{ $labels.persistentvolumeclaim }} is at {{ $value | humanizePercentage }}. Expand PVCs urgently to prevent WAL archiving failures."

    - name: garage-health
      rules:
        - alert: GarageReplicaDown
          expr: |
            kube_statefulset_replicas{namespace="garage", statefulset="garage"}
            - kube_statefulset_status_replicas_ready{namespace="garage", statefulset="garage"}
            > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Garage replica not ready"
            description: "{{ $value }} Garage replica(s) not ready in namespace garage."

        - alert: GarageReplicaCountDrift
          expr: |
            kube_statefulset_replicas{namespace="garage", statefulset="garage"}
            < count(kube_node_info{node=~"worker-.*"})
          for: 30m
          labels:
            severity: info
          annotations:
            summary: "Garage replicas < worker node count"
            description: "Garage has {{ $value }} fewer replicas than worker nodes. Consider scaling."

        - alert: GarageRpcTimeouts
          expr: sum by (pod) (increase(rpc_timeout_counter{namespace="garage"}[10m])) > 10
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Garage RPC timeouts on {{ $labels.pod }}"
            description: "Garage recorded {{ $value }} RPC timeouts in 10 minutes. Check cluster connectivity and node health."

        - alert: GarageS3ApiUnavailable
          expr: probe_success{job="probe/garage/garage-s3-api"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Garage S3 API did not process a request"
            description: "The Garage S3 endpoint did not return its expected API response. Check the S3 service, Garage pods, and cluster routing."

        - alert: GarageS3CanaryStale
          expr: time() - kube_cronjob_status_last_successful_time{namespace="garage",cronjob="garage-s3-canary"} > 900
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Garage S3 read/write canary is stale"
            description: "The S3 canary has not completed a put, get, compare, and delete cycle for over 15 minutes. Check Garage and the canary Job."

        - alert: GarageS3CanaryNeverSucceeded
          expr: kube_cronjob_info{namespace="garage",cronjob="garage-s3-canary"} unless on (namespace, cronjob) kube_cronjob_status_last_successful_time{namespace="garage",cronjob="garage-s3-canary"}
          for: 20m
          labels:
            severity: critical
          annotations:
            summary: "Garage S3 canary has never succeeded"
            description: "The S3 canary has not completed a successful read/write cycle since deployment. Inspect the CronJob and Garage bucket permissions."
