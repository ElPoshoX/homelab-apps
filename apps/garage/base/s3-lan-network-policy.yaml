apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: garage-s3-lan-access
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: garage
      app.kubernetes.io/instance: garage
  ingress:
    # Preserve Garage RPC, probes, and existing in-cluster S3 clients.
    - fromEntities:
        - cluster
        - host
    # TrueNAS pulls object backups over the LAN S3 endpoint.
    - fromCIDR:
        - 192.168.5.135/32
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
