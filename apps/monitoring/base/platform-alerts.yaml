apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: platform-alerts
spec:
  groups:
    - name: platform-gitops
      rules:
        - alert: ArgoApplicationOutOfSync
          expr: argocd_app_info{namespace="argocd",sync_status!="Synced"} == 1
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Argo CD app out of sync: {{ $labels.name }}"
            description: "{{ $labels.name }} has been {{ $labels.sync_status }} for 30 minutes. Inspect the Argo CD sync operation and repository revision."

        - alert: ArgoApplicationDegraded
          expr: argocd_app_info{namespace="argocd",health_status=~"Degraded|Missing|Unknown"} == 1
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "Argo CD app unhealthy: {{ $labels.name }}"
            description: "{{ $labels.name }} has health status {{ $labels.health_status }}. Inspect failing resources and recent syncs."

    - name: platform-dns
      rules:
        - alert: CoreDnsLookupFailed
          expr: probe_success{job="probe/monitoring/core-dns-functional"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Cluster DNS lookup failed"
            description: "The blackbox probe cannot resolve kubernetes.default.svc.cluster.local through CoreDNS. Check CoreDNS pods and the kube-dns service."

    - name: platform-certificates
      rules:
        - alert: CertificateExpiringSoon
          expr: certmanager_certificate_expiration_timestamp_seconds{namespace="ingress",name="homelab-wildcard-tls"} - time() < 604800
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Homelab TLS certificate expires within seven days"
            description: "The ingress wildcard certificate expires in {{ $value | humanizeDuration }}. Check cert-manager renewal and the Cloudflare DNS challenge."

        - alert: CertificateNotReady
          expr: certmanager_certificate_ready_status{namespace="ingress",name="homelab-wildcard-tls",condition="True"} == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Homelab TLS certificate is not ready"
            description: "The ingress wildcard certificate is not ready. Check its CertificateRequest and cert-manager logs."
