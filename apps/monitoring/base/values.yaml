# kube-prometheus-stack v85.0.1
# Replaces: prometheus (standalone), alertmanager (standalone), kube-state-metrics

fullnameOverride: monitoring

crds:
  enabled: true

# --- Prometheus Operator ---
prometheusOperator:
  enabled: true
  admissionWebhooks:
    enabled: false
  tls:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

# --- Prometheus ---
prometheus:
  enabled: true
  serviceAccount:
    createTokenSecret: false
  controlPlaneScrapeClass:
    enabled: true
  prometheusSpec:
    # Allow WAL replay to finish before the startup probe restarts Prometheus.
    maximumStartupDurationSeconds: 14400
    scrapeInterval: 15s
    scrapeTimeout: 10s
    evaluationInterval: 15s
    retention: 30d
    retentionSize: 55GB

    # Accept remote_write from Tempo metrics generator
    enableRemoteWriteReceiver: true

    # Select ALL ServiceMonitors/PodMonitors/Rules across all namespaces
    # Without these, only monitors with kube-prometheus-stack helm labels are picked up
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi

    resources:
      limits:
        cpu: 8000m
        memory: 8Gi
      requests:
        cpu: 2000m
        memory: 4Gi

    securityContext:
      runAsUser: 65534
      runAsNonRoot: true
      runAsGroup: 65534
      fsGroup: 65534

# --- AlertManager ---
alertmanager:
  enabled: true
  alertmanagerSpec:
    secrets:
      - alertmanager-irm-webhook
    alertmanagerConfigSelector: {}
    alertmanagerConfigNamespaceSelector: {}
    alertmanagerConfigMatcherStrategy:
      type: None
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi
    resources:
      limits:
        cpu: 200m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi
    securityContext:
      runAsUser: 65534
      runAsNonRoot: true
      runAsGroup: 65534
      fsGroup: 65534
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: default
      group_by:
        - namespace
        - alertname
        - service
      routes:
        - receiver: "null"
          matchers:
            - alertname = "Watchdog"
        - receiver: grafana-irm
    receivers:
      - name: default
      - name: "null"
      - name: grafana-irm
        webhook_configs:
          - url_file: /etc/alertmanager/secrets/alertmanager-irm-webhook/url
            send_resolved: true
            max_alerts: 99

# --- Grafana: managed separately ---
grafana:
  enabled: false

# --- kube-state-metrics: replaces standalone app ---
kube-state-metrics:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

# --- Node Exporter ---
nodeExporter:
  enabled: true

# --- Talos: disable components that don't exist or bind to localhost only ---
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false

# --- Default recording + alerting rules ---
defaultRules:
  create: true
