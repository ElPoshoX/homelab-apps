apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-config
data:
  config.yaml.tmpl: |
    model:
      default: claude-sonnet
      provider: custom
      base_url: http://litellm.aegis-gateway.svc.cluster.local:4000/v1
      api_key: __LITELLM_API_KEY__
    dashboard:
      enabled: true
      basic_auth:
        username: poshox
        password_hash: "__DASHBOARD_PASSWORD_HASH__"
    terminal:
      backend: docker
    # Discord platform — survives pod restarts because bootstrap-config
    # regenerates /opt/data/config.yaml from THIS template every start.
    # Credentials/allowed-users live in hermes-secrets (DISCORD_* env vars).
    platforms:
      discord:
        enabled: true
    discord:
      require_mention: false
    plugins:
      enabled:
        - basic
