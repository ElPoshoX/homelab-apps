apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-config
data:
  config.yaml.tmpl: |
    # Model provider will be configured when Hermes is connected to Headroom.
    dashboard:
      enabled: true
      basic_auth:
        username: poshox
        password_hash: "__DASHBOARD_PASSWORD_HASH__"
    webapp:
      enabled: true
      host: 0.0.0.0
      port: 9119
      public_url: https://hermes.elposhox.dev
    terminal:
      backend: docker
    agent:
      max_turns: 90
    # Discord platform — bootstrap-config seeds a new home from this template.
    # Credentials/allowed-users live in hermes-secrets (DISCORD_* env vars).
    platforms:
      discord:
        enabled: true
    discord:
      require_mention: false
    mcp_servers:
      linear:
        url: https://mcp.linear.app/mcp
        auth: oauth
        enabled: true
      grafana:
        url: http://127.0.0.1:8000/mcp
        enabled: true
    plugins:
      enabled:
        - basic
