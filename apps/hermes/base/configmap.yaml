apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-config
data:
  config.yaml.tmpl: |
    # Model provider will be configured when Hermes is connected to Headroom.
    dashboard:
      enabled: true
      basic_auth:
        username: poshox
        password_hash: "__DASHBOARD_PASSWORD_HASH__"
    webapp:
      enabled: true
      host: 0.0.0.0
      port: 9119
      public_url: https://hermes.elposhox.dev
    terminal:
      backend: docker
    # Discord platform — survives pod restarts because bootstrap-config
    # regenerates /opt/data/config.yaml from THIS template every start.
    # Credentials/allowed-users live in hermes-secrets (DISCORD_* env vars).
    platforms:
      discord:
        enabled: true
    discord:
      require_mention: false
    plugins:
      enabled:
        - basic
