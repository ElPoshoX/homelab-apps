apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-config
data:
  managed.env: |
    HERMES_CODEX_BASE_URL=http://headroom.headroom.svc.cluster.local:8081/backend-api/codex
  config.yaml.tmpl: |
    model:
      default: gpt-6-sol
      provider: openai-codex
    dashboard:
      enabled: true
      basic_auth:
        username: poshox
        password_hash: "__DASHBOARD_PASSWORD_HASH__"
    webapp:
      enabled: true
      host: 0.0.0.0
      port: 9119
      public_url: https://hermes.elposhox.dev
    terminal:
      backend: ssh
    memory:
      provider: hindsight
    agent:
      max_turns: 90
    delegation:
      backend: profile_routes
      backends:
        profile_routes:
          profiles:
            - name: platform
              description: Kubernetes, GitOps, infrastructure, and operational changes.
            - name: incident
              description: Alert triage, evidence gathering, and incident response.
            - name: knowledge
              description: Research, documentation, and knowledge maintenance.
    # Discord platform — bootstrap-config seeds a new home from this template.
    # Credentials/allowed-users live in hermes-secrets (DISCORD_* env vars).
    platforms:
      discord:
        enabled: true
    discord:
      require_mention: false
    mcp_servers:
      linear:
        url: https://mcp.linear.app/mcp
        auth: oauth
        enabled: true
      grafana:
        url: http://127.0.0.1:8000/mcp
        enabled: true
    plugins:
      enabled:
        - basic
        - kepler-reminders
