apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-data
  labels:
    recurring-job.longhorn.io/source: enabled
    recurring-job-group.longhorn.io/app-state: enabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 20Gi
