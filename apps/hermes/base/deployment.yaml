apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
  labels:
    app: hermes
    app.kubernetes.io/name: hermes
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hermes
  template:
    metadata:
      labels:
        app: hermes
        app.kubernetes.io/name: hermes
      annotations:
        homelab.local/incident-listener-revision: "4"
        homelab.local/catalog-overlay-revision: "2"
        homelab.local/github-mcp-revision: "5"
        homelab.local/reminder-plugin-revision: "1"
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: catalog-overlay
          image: nousresearch/hermes-agent:v0.23.4@sha256:ef0650d523ee1b5ab32c779acabc446d9936869a9932591553688a62bcf0c42f
          imagePullPolicy: IfNotPresent
          command: [/opt/hermes/.venv/bin/python, /opt/hermes-catalog-overlay/hide-composio.py]
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: catalog-overlay-script
              mountPath: /opt/hermes-catalog-overlay
              readOnly: true
            - name: catalog-overlay-code
              mountPath: /opt/hermes-patch
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
        - name: bootstrap-config
          image: busybox
          env:
            - name: DASHBOARD_PASSWORD_HASH
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: DASHBOARD_PASSWORD_HASH
            - name: INCIDENT_API_SERVER_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-incident-api
                  key: key
          command:
            - sh
            - -c
            - |
              set -e
              mkdir -p /opt/data
              # Hermes updates its config on the PVC (including MCP connections).
              # Only seed a new home; never erase changes on pod restart.
              if [ ! -s /opt/data/config.yaml ]; then
                sed -e "s|__DASHBOARD_PASSWORD_HASH__|$DASHBOARD_PASSWORD_HASH|" \
                    /tmp/hermes-config/config.yaml.tmpl > /opt/data/config.yaml
              fi
              if [ -d /opt/data/profiles/incident ]; then
                env_file=/opt/data/profiles/incident/.env
                touch "$env_file"
                sed -i '/^API_SERVER_KEY=/d' "$env_file"
                printf 'API_SERVER_KEY=%s\n' "$INCIDENT_API_SERVER_KEY" >> "$env_file"
                chmod 600 "$env_file"
              fi
              # Existing PVC homes are not replaced by the template above.
              for config in /opt/data/config.yaml /opt/data/profiles/*/config.yaml; do
                [ -f "$config" ] || continue
                if ! grep -q 'docker_run_as_host_user:' "$config"; then
                  sed -i '/^terminal:$/a\  docker_run_as_host_user: true\n  docker_volumes:\n    - /vault:/vault:rw' "$config"
                fi
              done
              for home in /opt/data /opt/data/profiles/*; do
                [ -d "$home" ] || continue
                env_file="$home/.env"
                if [ -f "$env_file" ]; then
                  sed -i '/^HERMES_CODEX_BASE_URL=/d' "$env_file"
                  chmod 600 "$env_file"
                fi
                for skill in /tmp/vault-skills/*; do
                  name="${skill##*/}"
                  mkdir -p "$home/skills/$name"
                  cp "$skill" "$home/skills/$name/SKILL.md"
                done
              done
              chown -R 1000:1000 /opt/data
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: hermes-data
              mountPath: /opt/data
            - name: hermes-config-tmpl
              mountPath: /tmp/hermes-config
            - name: vault-skills
              mountPath: /tmp/vault-skills
              readOnly: true

        - name: configure-github-mcp
          image: nousresearch/hermes-agent:v0.23.4@sha256:ef0650d523ee1b5ab32c779acabc446d9936869a9932591553688a62bcf0c42f
          imagePullPolicy: IfNotPresent
          command: [/opt/hermes/.venv/bin/python, /opt/hermes-github-mcp/configure-github-mcp.py]
          env:
            - name: GITHUB_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-github-mcp
                  key: token
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: hermes-data
              mountPath: /opt/data
            - name: github-mcp-config
              mountPath: /opt/hermes-github-mcp
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi

        - name: install-reminder-plugin
          image: nousresearch/hermes-agent:v0.23.4@sha256:ef0650d523ee1b5ab32c779acabc446d9936869a9932591553688a62bcf0c42f
          command: [/opt/hermes/.venv/bin/python, /opt/hermes-reminders/install.py]
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: hermes-data
              mountPath: /opt/data
            - name: reminder-plugin
              mountPath: /opt/hermes-reminders
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi

      containers:
        - name: hermes
          image: nousresearch/hermes-agent:v0.23.4@sha256:ef0650d523ee1b5ab32c779acabc446d9936869a9932591553688a62bcf0c42f
          imagePullPolicy: IfNotPresent
          # Default CMD is the interactive CLI, which exits immediately when
          # stdin isn't a TTY. "gateway run" is the documented headless/daemon
          # mode (see docker-compose.yml in the upstream repo).
          args:
            - gateway
            - run
          ports:
            - containerPort: 8642
              name: gateway
            - containerPort: 9119
              name: webapp
            - containerPort: 8644
              name: webhook
          env:
            - name: HERMES_UID
              value: "1000"
            - name: HERMES_GID
              value: "1000"
            - name: API_SERVER_ENABLED
              value: "true"
            - name: API_SERVER_HOST
              value: "0.0.0.0"
            - name: DOCKER_HOST
              value: unix:///run/docker/docker.sock
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://opentelemetry-collector.otel-collector.svc.cluster.local:4317"
            - name: OTEL_SERVICE_NAME
              value: "hermes"
            - name: OPENMAIL_MODE
              value: channel
            - name: OPENMAIL_ALLOWED_USERS
              value: poshox.pr@gmail.com
            - name: KEPLER_REMINDER_CHANNEL_ID
              value: "1575712003639484577"
            - name: KEPLER_REMINDER_OWNER_ID
              value: "1261063491540746291"
            - name: no_proxy
              value: ".svc.cluster.local,.cluster.local,10.0.0.0/8"
            - name: NO_PROXY
              value: ".svc.cluster.local,.cluster.local,10.0.0.0/8"
          envFrom:
            - secretRef:
                name: hermes-secrets
            - secretRef:
                name: hermes-openmail
          volumeMounts:
            - name: catalog-overlay-code
              mountPath: /opt/hermes/hermes_cli/plugin_catalog.py
              subPath: plugin_catalog.py
              readOnly: true
            - name: hermes-data
              mountPath: /opt/data
            - name: hermes-config-tmpl
              mountPath: /etc/hermes/.env
              subPath: managed.env
              readOnly: true
            - name: obsidian-vault
              mountPath: /vault
              subPath: ElPoshoX-Vault
            - name: docker-socket
              mountPath: /run/docker
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /health
              port: gateway
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: gateway
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: gateway
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          # Required, verified against a real self-hosted-cluster deployment writeup:
          # the image's s6-overlay init calls setgroups() while dropping from root to
          # the unprivileged hermes user — that syscall requires real root and cannot
          # be satisfied by runAsNonRoot + capability grants alone.
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: true
            capabilities:
              add:
                - SETUID
                - SETGID
                - CHOWN
            seccompProfile:
              type: RuntimeDefault

        - name: dind
          image: docker:27-dind
          args:
            - dockerd
            - --host=unix:///run/docker/docker.sock
            # hermes's own internal privilege drop (s6-setuidgid) re-resolves
            # groups from /etc/group and loses k8s's pod-level
            # supplementalGroups, so the socket's group has to be hermes's
            # *primary* gid (1000) instead of the dind image's default (2375)
            # for the post-drop worker process to reach it at all.
            - --group=1000
          securityContext:
            privileged: true
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          volumeMounts:
            - name: dind-storage
              mountPath: /var/lib/docker
            - name: docker-socket
              mountPath: /run/docker
            # execute_code's ephemeral containers are spawned by *this*
            # daemon via `docker run`, so any -v bind mount they get has to
            # resolve from dind's own filesystem view, not the sibling
            # "hermes" container's. Same PVC, same path, mounted twice —
            # RWO only restricts to one node, not one container.
            - name: hermes-data
              mountPath: /opt/data
            - name: obsidian-vault
              mountPath: /vault
              subPath: ElPoshoX-Vault
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 4Gi

        # The model proxy reuses the existing Nous Portal login. It is reachable
        # only from the kagent namespace through a ClusterIP and Cilium policy.
        - name: model-proxy
          image: nousresearch/hermes-agent:v0.23.4@sha256:ef0650d523ee1b5ab32c779acabc446d9936869a9932591553688a62bcf0c42f
          imagePullPolicy: IfNotPresent
          # The image entrypoint starts every s6 gateway slot. Run only the
          # proxy CLI here so this sidecar cannot start a second gateway.
          command: [/opt/hermes/.venv/bin/hermes]
          args:
            - proxy
            - start
            - --host
            - 0.0.0.0
            - --port
            - "8645"
          ports:
            - containerPort: 8645
              name: model-proxy
          volumeMounts:
            - name: hermes-data
              mountPath: /opt/data
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault

        - name: incident-listener
          image: nousresearch/hermes-agent:v0.23.4@sha256:ef0650d523ee1b5ab32c779acabc446d9936869a9932591553688a62bcf0c42f
          imagePullPolicy: IfNotPresent
          command: [/opt/hermes/.venv/bin/python, -u, /opt/incident-listener/listen.py]
          env:
            - name: DISCORD_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: DISCORD_BOT_TOKEN
            - name: INCIDENT_API_SERVER_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-incident-api
                  key: key
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: hermes-data
              mountPath: /opt/data
            - name: incident-listener
              mountPath: /opt/incident-listener
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi

        - name: grafana-mcp
          image: grafana/mcp-grafana:2.4.0
          imagePullPolicy: IfNotPresent
          args:
            - -t
            - streamable-http
            - --address
            - 127.0.0.1:8000
            - --log-tool-calls
          env:
            - name: GRAFANA_URL
              value: http://grafana.grafana.svc.cluster.local:3000
            - name: GRAFANA_SERVICE_ACCOUNT_TOKEN_FILE
              value: /var/run/secrets/grafana/token
          ports:
            - containerPort: 8000
              name: grafana-mcp
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: grafana-mcp-token
              mountPath: /var/run/secrets/grafana
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

      securityContext:
        fsGroup: 1000
        supplementalGroups: [2375]
      volumes:
        - name: catalog-overlay-script
          configMap:
            name: hermes-catalog-overlay
        - name: catalog-overlay-code
          emptyDir: {}
        - name: github-mcp-config
          configMap:
            name: hermes-github-mcp-config
        - name: reminder-plugin
          configMap:
            name: hermes-reminder-plugin
        - name: hermes-data
          persistentVolumeClaim:
            claimName: hermes-data
        - name: hermes-config-tmpl
          configMap:
            name: hermes-config
        - name: docker-socket
          emptyDir: {}
        - name: dind-storage
          persistentVolumeClaim:
            claimName: hermes-dind-storage
        - name: obsidian-vault
          nfs:
            server: truenas.elposhox.dev
            path: /mnt/HomeLab/Obsidian-Vault
        - name: vault-skills
          configMap:
            name: hermes-vault-skills
        - name: incident-listener
          configMap:
            name: hermes-incident-listener
        - name: grafana-mcp-token
          secret:
            secretName: hermes-grafana-mcp
