apiVersion: v1
kind: Service
metadata:
  name: hermes
  labels:
    app.kubernetes.io/name: hermes
spec:
  selector:
    app: hermes
  ports:
    - name: gateway
      port: 8642
      targetPort: gateway
      protocol: TCP
    - name: dashboard
      port: 9119
      targetPort: dashboard
      protocol: TCP
    - name: webhook
      port: 8644
      targetPort: webhook
      protocol: TCP
