apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/part-of: hermes
      homelab.local/OwnedBy: ElPoshoX

namespace: hermes

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - grafana-mcp-secret.yaml
  - incident-api-secret.yaml
  - github-mcp-secret.yaml
  - openmail-secret.yaml
  - pull-secret.yaml
  - executor-ssh-secret.yaml
  - pvc.yaml
  - deployment.yaml
  - executor-deployment.yaml
  - service.yaml
  - ingress.yaml
  - network-policy.yaml

configMapGenerator:
  - name: hermes-incident-policy
    files:
      - SOUL.md=incident-soul.md
  - name: hermes-incident-listener
    files:
      - listen.py=incident-listener.py
  - name: hermes-catalog-overlay
    files:
      - hide-composio.py
  - name: hermes-github-mcp-config
    files:
      - configure-github-mcp.py
      - github-token-reminder.py
  - name: hermes-reminder-plugin
    files:
      - __init__.py=reminder-plugin/__init__.py
      - core.py=reminder-plugin/core.py
      - plugin.yaml=reminder-plugin/plugin.yaml
      - install.py=reminder-plugin/install.py
      - skill.md=reminder-plugin/skills/reminders/SKILL.md
  - name: hermes-vault-skills
    files:
      - vault-consolidate=vault-skills/vault-consolidate.md
      - vault-cross-link=vault-skills/vault-cross-link.md
      - vault-dedup=vault-skills/vault-dedup.md
      - vault-ingest=vault-skills/vault-ingest.md
      - vault-insights=vault-skills/vault-insights.md
      - vault-lint=vault-skills/vault-lint.md
      - vault-synthesize=vault-skills/vault-synthesize.md
generatorOptions:
  disableNameSuffixHash: true
