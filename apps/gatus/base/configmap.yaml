apiVersion: v1
kind: ConfigMap
metadata:
  name: gatus-config
data:
  config.yaml: |-
    web:
      port: 8080
    ui:
      title: Kepler Status
      header: Kepler
      dashboard-heading: Homelab status
      dashboard-subheading: Current health of core services
    storage:
      type: sqlite
      path: /data/gatus.db
      maximum-number-of-results: 200
      maximum-number-of-events: 50
    metrics: true
    endpoints:
      - name: CoreDNS
        group: Network
        url: kube-dns.kube-system.svc.cluster.local
        interval: 1m
        dns:
          query-name: kubernetes.default.svc.cluster.local
          query-type: A
        conditions:
          - "[DNS_RCODE] == NOERROR"
      - name: AdGuard DNS
        group: Network
        url: adguard-home-udp.adguard.svc.cluster.local
        interval: 1m
        dns:
          query-name: example.com
          query-type: A
        conditions:
          - "[DNS_RCODE] == NOERROR"
      - name: NATS
        group: Network
        url: tcp://nats.nats.svc.cluster.local:4222
        interval: 1m
        conditions:
          - "[CONNECTED] == true"
      - name: Garage S3
        group: Storage
        url: http://garage.garage.svc.cluster.local:3900/
        interval: 1m
        conditions:
          - "[STATUS] == 403"
      - name: Grafana
        group: Observability
        url: http://grafana.grafana.svc.cluster.local:3000/api/health
        interval: 1m
        conditions:
          - "[STATUS] == 200"
      - name: Prometheus
        group: Observability
        url: http://monitoring-prometheus.monitoring.svc.cluster.local:9090/-/ready
        interval: 1m
        conditions:
          - "[STATUS] == 200"
      - name: Alertmanager
        group: Observability
        url: http://monitoring-alertmanager.monitoring.svc.cluster.local:9093/-/ready
        interval: 1m
        conditions:
          - "[STATUS] == 200"
      - name: Critical alerts
        group: Observability
        url: http://monitoring-prometheus.monitoring.svc.cluster.local:9090/api/v1/query?query=count%28ALERTS%7Balertstate%3D%22firing%22%2Cseverity%3D%22critical%22%7D%29%20or%20vector%280%29
        interval: 1m
        conditions:
          - "[STATUS] == 200"
          - "[BODY].data.result[0].value[1] == 0"
      - name: Loki
        group: Observability
        url: http://loki.loki.svc.cluster.local:3100/ready
        interval: 1m
        conditions:
          - "[STATUS] == 200"
      - name: Mimir
        group: Observability
        url: http://mimir-distributor.mimir.svc.cluster.local:8009/ready
        interval: 1m
        conditions:
          - "[STATUS] == 200"
      - name: Tempo
        group: Observability
        url: http://tempo.tempo.svc.cluster.local:3200/ready
        interval: 1m
        conditions:
          - "[STATUS] == 200"
