apiVersion: v1
kind: ConfigMap
metadata:
  name: gatus-config
data:
  config.yaml: |-
    web:
      port: 8080
    ui:
      title: Kepler Status
      header: Kepler
      dashboard-heading: Homelab status
      dashboard-subheading: Live availability across the homelab
    storage:
      type: sqlite
      path: /data/gatus.db
      maximum-number-of-results: 200
      maximum-number-of-events: 50
    metrics: true
    endpoints:
      - name: CoreDNS
        group: Network & DNS
        url: kube-dns.kube-system.svc.cluster.local
        interval: 1m
        dns:
          query-name: kubernetes.default.svc.cluster.local
          query-type: A
        conditions:
          - "[DNS_RCODE] == NOERROR"
      - name: AdGuard DNS
        group: Network & DNS
        url: adguard-home-udp.adguard.svc.cluster.local
        interval: 1m
        dns:
          query-name: example.com
          query-type: A
        conditions:
          - "[DNS_RCODE] == NOERROR"
      - name: AdGuard Sync
        group: Network & DNS
        url: tcp://adguard-sync.adguard-sync.svc.cluster.local:80
        interval: 1m
        conditions:
          - "[CONNECTED] == true"
      - name: NATS
        group: Platform Services
        url: tcp://nats.nats.svc.cluster.local:4222
        interval: 1m
        conditions:
          - "[CONNECTED] == true"
      - name: Garage S3
        group: Data & Storage
        url: http://garage.garage.svc.cluster.local:3900/
        interval: 1m
        conditions:
          - "[STATUS] == 403"
      - name: PostgreSQL
        group: Data & Storage
        url: tcp://postgres-rw.postgres.svc.cluster.local:5432
        interval: 1m
        conditions:
          - "[CONNECTED] == true"
      - name: CouchDB
        group: Data & Storage
        url: http://couchdb.couchdb.svc.cluster.local:5984/_up
        interval: 1m
        conditions:
          - "[STATUS] == 200"
      - name: Vault WebDAV
        group: Data & Storage
        url: http://vault-webdav.vault-webdav.svc.cluster.local/
        interval: 1m
        conditions:
          - "[STATUS] == 401"
      - name: Longhorn UI
        group: Data & Storage
        url: http://longhorn-frontend.longhorn-system.svc.cluster.local/
        interval: 1m
        conditions:
          - "[STATUS] == 200"
      - name: CloudNativePG webhook
        group: Platform Services
        url: tcp://cnpg-webhook-service.cnpg-system.svc.cluster.local:443
        interval: 1m
        conditions:
          - "[CONNECTED] == true"
      - name: Metrics Server
        group: Platform Services
        url: tcp://metrics-server.kube-system.svc.cluster.local:443
        interval: 1m
        conditions:
          - "[CONNECTED] == true"
      - name: Argo CD
        group: Platform Services
        url: http://argocd-server.argocd.svc.cluster.local/healthz
        interval: 1m
        conditions:
          - "[STATUS] == 200"
      - name: Gatus
        group: Platform Services
        url: http://gatus.gatus.svc.cluster.local/health
        interval: 1m
        conditions:
          - "[STATUS] == 200"
      - name: OpenTelemetry Collector
        group: Observability
        url: tcp://opentelemetry-collector.otel-collector.svc.cluster.local:4317
        interval: 1m
        conditions:
          - "[CONNECTED] == true"
      - name: Grafana
        group: Observability
        url: http://grafana.grafana.svc.cluster.local:3000/api/health
        interval: 1m
        conditions:
          - "[STATUS] == 200"
      - name: Prometheus
        group: Observability
        url: http://monitoring-prometheus.monitoring.svc.cluster.local:9090/-/ready
        interval: 1m
        conditions:
          - "[STATUS] == 200"
      - name: Alertmanager
        group: Observability
        url: http://monitoring-alertmanager.monitoring.svc.cluster.local:9093/-/ready
        interval: 1m
        conditions:
          - "[STATUS] == 200"
      - name: Critical alerts
        group: Observability
        url: http://monitoring-prometheus.monitoring.svc.cluster.local:9090/api/v1/query?query=count%28ALERTS%7Balertstate%3D%22firing%22%2Cseverity%3D%22critical%22%7D%29%20or%20vector%280%29
        interval: 1m
        conditions:
          - "[STATUS] == 200"
          - "[BODY].data.result[0].value[1] == 0"
      - name: Loki
        group: Observability
        url: http://loki.loki.svc.cluster.local:3100/ready
        interval: 1m
        conditions:
          - "[STATUS] == 200"
      - name: Mimir
        group: Observability
        url: http://mimir-distributor.mimir.svc.cluster.local:8009/ready
        interval: 1m
        conditions:
          - "[STATUS] == 200"
      - name: Tempo
        group: Observability
        url: http://tempo.tempo.svc.cluster.local:3200/ready
        interval: 1m
        conditions:
          - "[STATUS] == 200"
      - name: Hermes
        group: Applications
        url: http://hermes.hermes.svc.cluster.local:8642/health
        interval: 1m
        conditions:
          - "[STATUS] == 200"
      - name: Hindsight
        group: Platform Services
        url: http://hindsight.hindsight.svc.cluster.local:8888/health/ready
        interval: 1m
        conditions:
          - "[STATUS] == 200"
      - name: kagent Controller
        group: Platform Services
        url: http://kagent-controller.kagent.svc.cluster.local:8083/health
        interval: 1m
        conditions:
          - "[STATUS] == 200"
      - name: Kepler Pilot Agent
        group: Platform Services
        url: http://kepler-pilot.kagent.svc.cluster.local:8080/.well-known/agent-card.json
        interval: 1m
        conditions:
          - "[STATUS] == 200"
      - name: Headroom
        group: Applications
        url: http://headroom.headroom.svc.cluster.local/readyz
        interval: 1m
        conditions:
          - "[STATUS] == 200"
      - name: Officina
        group: Applications
        url: http://officina.officina.svc.cluster.local:8080/healthz
        interval: 1m
        conditions:
          - "[STATUS] == 200"
      - name: CloudBeaver
        group: Applications
        url: http://cloudbeaver.cloudbeaver.svc.cluster.local:8978/status
        interval: 1m
        conditions:
          - "[STATUS] == 200"
      - name: Homepage
        group: Applications
        url: http://homepage.homepage.svc.cluster.local/
        headers:
          Host: home.elposhox.dev
        interval: 1m
        conditions:
          - "[STATUS] == 200"
      - name: Speedtest Exporter
        group: Applications
        url: http://myspeed.myspeed.svc.cluster.local/healthz
        interval: 1m
        conditions:
          - "[STATUS] == 200"
