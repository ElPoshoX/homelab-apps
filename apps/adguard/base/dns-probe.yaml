apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: adguard-dns-functional
spec:
  interval: 30s
  scrapeTimeout: 15s
  module: dns_external
  prober:
    url: monitoring-blackbox-exporter.monitoring.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - adguard-home-udp.adguard.svc.cluster.local:53
      labels:
        service: adguard-dns
