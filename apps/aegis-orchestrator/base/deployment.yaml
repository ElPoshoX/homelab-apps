apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis-orchestrator
  labels:
    app.kubernetes.io/name: aegis-orchestrator
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: aegis-orchestrator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aegis-orchestrator
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: aegis-orchestrator
          image: ghcr.io/elposhox/aegis-orchestrator:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: AEGIS_VAULT_PATH
              value: /vault
            - name: AEGIS_LITELLM_URL
              value: http://aegis-gateway.aegis-gateway.svc.cluster.local:4000
            - name: AEGIS_EVAL_MODEL
              value: deepseek-v4-flash
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://opentelemetry-collector.otel-collector.svc.cluster.local:4317
            - name: OTEL_SERVICE_NAME
              value: aegis-orchestrator
          volumeMounts:
            - name: vault
              mountPath: /vault
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      volumes:
        - name: vault
          nfs:
            server: truenas.elposhox.dev
            path: /mnt/HomeLab/Obsidian-Vault/agents/aegis
---
apiVersion: v1
kind: Service
metadata:
  name: aegis-orchestrator
  labels:
    app.kubernetes.io/name: aegis-orchestrator
spec:
  selector:
    app.kubernetes.io/name: aegis-orchestrator
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
