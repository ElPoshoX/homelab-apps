apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis-orchestrator
  labels:
    app.kubernetes.io/name: aegis-orchestrator
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: aegis-orchestrator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aegis-orchestrator
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull-secret
      initContainers:
        - name: git-init
          image: alpine/git:2.47.2
          command: ["sh", "-c"]
          args:
            - |
              cd /vault
              if [ ! -d .git ]; then
                git init
                git config user.email "aegis@elposhox.dev"
                git config user.name "Aegis Orchestrator"
                git add -A
                git commit -m "init: vault baseline"
              fi
          volumeMounts:
            - name: vault
              mountPath: /vault
          securityContext:
            runAsUser: 3000
            runAsGroup: 3000
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      containers:
        - name: aegis-orchestrator
          image: ghcr.io/elposhox/aegis-orchestrator:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: AEGIS_VAULT_PATH
              value: /vault
            - name: AEGIS_LITELLM_URL
              value: http://litellm.aegis-gateway.svc.cluster.local:4000
            - name: AEGIS_EVAL_MODEL
              value: deepseek-v4-flash
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: aegis-orchestrator-secrets
                  key: LITELLM_MASTER_KEY
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://opentelemetry-collector.otel-collector.svc.cluster.local:4317
            - name: OTEL_SERVICE_NAME
              value: aegis-orchestrator
            - name: GIT_AUTHOR_NAME
              value: Aegis Orchestrator
            - name: GIT_AUTHOR_EMAIL
              value: aegis@elposhox.dev
            - name: GIT_COMMITTER_NAME
              value: Aegis Orchestrator
            - name: GIT_COMMITTER_EMAIL
              value: aegis@elposhox.dev
          volumeMounts:
            - name: vault
              mountPath: /vault
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            runAsUser: 3000
            runAsGroup: 3000
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      volumes:
        - name: vault
          nfs:
            server: truenas.elposhox.dev
            path: /mnt/HomeLab/Obsidian-Vault/ElPoshoX-Vault/agents/aegis
---
apiVersion: v1
kind: Service
metadata:
  name: aegis-orchestrator
  labels:
    app.kubernetes.io/name: aegis-orchestrator
spec:
  selector:
    app.kubernetes.io/name: aegis-orchestrator
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
