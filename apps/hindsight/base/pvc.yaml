apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hindsight-data
  labels:
    recurring-job.longhorn.io/source: enabled
    recurring-job-group.longhorn.io/app-state: enabled
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hindsight-auth
  labels:
    recurring-job.longhorn.io/source: enabled
    recurring-job-group.longhorn.io/app-state: enabled
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
