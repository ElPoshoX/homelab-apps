apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hindsight
spec:
  endpointSelector:
    matchLabels:
      app: hindsight
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: hermes
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: gatus
      toPorts:
        - ports:
            - port: "8888"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
    - toEntities: [world]
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
