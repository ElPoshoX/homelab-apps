apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: longhorn-alerts
spec:
  groups:
    - name: longhorn-health
      rules:
        - alert: LonghornVolumeFaulted
          expr: max by (volume, pvc, pvc_namespace) (longhorn_volume_robustness{namespace="longhorn-system",state="faulted"}) == 1
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Longhorn volume faulted: {{ $labels.pvc_namespace }}/{{ $labels.pvc }}"
            description: "Volume {{ $labels.volume }} is faulted. Check replicas and disk health before restarting its workload."

        - alert: LonghornVolumeDegraded
          expr: max by (volume, pvc, pvc_namespace) (longhorn_volume_robustness{namespace="longhorn-system",state="degraded"}) == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Longhorn volume degraded: {{ $labels.pvc_namespace }}/{{ $labels.pvc }}"
            description: "Volume {{ $labels.volume }} has remained degraded for 15 minutes. Check replica rebuilding and available storage."

        - alert: LonghornDiskNotReady
          expr: min by (node, disk) (longhorn_disk_status{namespace="longhorn-system",condition="ready"}) == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Longhorn disk not ready on {{ $labels.node }}"
            description: "Disk {{ $labels.disk }} is not ready. Inspect the disk and affected volume replicas."

        - alert: LonghornBackupStale
          expr: max by (volume, pvc, pvc_namespace) (time() - longhorn_volume_last_backup_at{namespace="longhorn-system"}) > 129600
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Longhorn backup stale: {{ $labels.pvc_namespace }}/{{ $labels.pvc }}"
            description: "Volume {{ $labels.volume }} has not completed a backup for over 36 hours. Check the backup target and recurring jobs."
