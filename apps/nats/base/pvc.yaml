apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nats-js-nats-0
  labels:
    recurring-job.longhorn.io/source: enabled
    recurring-job-group.longhorn.io/app-state: enabled
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
