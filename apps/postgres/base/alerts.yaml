apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: postgres-alerts
  labels:
    app.kubernetes.io/name: postgres
spec:
  groups:
    - name: postgres-storage
      rules:
        - alert: PostgresDiskUsageHigh
          expr: |
            (
              kubelet_volume_stats_used_bytes{namespace="postgres", persistentvolumeclaim=~"postgres-.*"}
              / kubelet_volume_stats_capacity_bytes{namespace="postgres", persistentvolumeclaim=~"postgres-.*"}
            ) > 0.80
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "PostgreSQL disk usage above 80%"
            description: "PVC {{ $labels.persistentvolumeclaim }} is at {{ $value | humanizePercentage }}."

        - alert: PostgresDiskUsageCritical
          expr: |
            (
              kubelet_volume_stats_used_bytes{namespace="postgres", persistentvolumeclaim=~"postgres-.*"}
              / kubelet_volume_stats_capacity_bytes{namespace="postgres", persistentvolumeclaim=~"postgres-.*"}
            ) > 0.90
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "PostgreSQL disk usage above 90%"
            description: "PVC {{ $labels.persistentvolumeclaim }} is at {{ $value | humanizePercentage }}. Expand storage urgently."

    - name: postgres-health
      rules:
        - alert: PostgresReplicaDown
          expr: cnpg_collector_up{namespace="postgres"} == 0
          for: 3m
          labels:
            severity: warning
          annotations:
            summary: "PostgreSQL replica down"
            description: "Pod {{ $labels.pod }} is not responding."

        - alert: PostgresReplicationLag
          expr: cnpg_pg_replication_lag{namespace="postgres"} > 30
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "PostgreSQL replication lag > 30s"
            description: "Replica {{ $labels.pod }} is {{ $value }}s behind primary."

        - alert: PostgresWALArchivingFailed
          expr: |
            cnpg_pg_stat_archiver_last_failed_time{namespace="postgres"}
              > cnpg_pg_stat_archiver_last_archived_time{namespace="postgres"}
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "PostgreSQL WAL archiving failed"
            description: "The last WAL archive attempt on {{ $labels.pod }} failed after the last successful archive. Check the CNPG archiver and backup target."

        - alert: PostgresBackupStale
          expr: |
            time() - max by (namespace) (cnpg_collector_last_available_backup_timestamp{namespace="postgres"}) > 108000
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "PostgreSQL base backup is over 30 hours old"
            description: "No successful CNPG base backup has been available for over 30 hours. Check the scheduled backup and Garage target."
