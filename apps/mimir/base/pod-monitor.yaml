apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: mimir
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: mimir
      app.kubernetes.io/instance: mimir
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          - compactor
          - distributor
          - ingester
          - querier
          - query-frontend
          - query-scheduler
          - store-gateway
  podMetricsEndpoints:
    - port: http-metrics
      path: /metrics
      interval: 30s
